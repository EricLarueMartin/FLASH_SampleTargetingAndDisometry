# FLASH motion/run server on pi-06-ioc, shared with DoseCam.
# Install as /etc/systemd/system/motor_control.service.d/combined.conf
[Service]
# Only nginx (port 80) talks to this server: /motion/, /run/ and /socket.io/ are
# proxied here; DoseCam stays at / on 127.0.0.1:8000.
Environment=FLASH_HTTP_HOST=127.0.0.1
Environment=FLASH_HTTP_PORT=8081
# Open only the OV5647; never fall back to DoseCam's IMX296 if the OV5647 drops out.
Environment=FLASH_CAMERA_MODEL=ov5647
# The Reset camera button must never stop DoseCam or its rpicam captures.
Environment=FLASH_PROTECTED_PROCESSES=rpicam-,dose_cam
# ESP32 stepper controller (CH9102 "1a86"). The DoseCam ESP8266 is the CP2104 on ttyUSB0.
Environment=FLASH_SERIAL_PORT=/dev/serial/by-id/usb-1a86_USB_Single_Serial_5185027606-if00
Environment=FLASH_DOSECAM_URL=http://127.0.0.1:8000
# DoseCam Wi-Fi hotspot: may watch and ABORT, may not plan/start runs or fire.
Environment=FLASH_RUN_DENY_NETS=192.168.50.0/24
# Read-only CA status of BST:INJ:START. Ask cr-01-ioc only (boostinj also answers for it).
Environment=EPICS_CA_AUTO_ADDR_LIST=NO
Environment=EPICS_CA_ADDR_LIST=192.168.16.41
# Live firing (ssh gateway account/host/key) is set on the Settings page and stored
# in ~test/.config/flash/settings.json; see deploy/fire-gateway/README.md.
