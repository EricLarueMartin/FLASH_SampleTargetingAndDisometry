<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#526078}.pin{fill:#f3c969;stroke:#674f16;stroke-width:3}.used{stroke:#e43d30;stroke-width:7}.label{font-size:16px;font-weight:600;text-anchor:middle}.small{font-size:18px}.call{font-size:22px;font-weight:650}.wire{fill:none;stroke-linecap:round;stroke-width:18}.stripe{fill:none;stroke:#fff;stroke-linecap:butt;stroke-width:7;stroke-dasharray:18 18}.note{fill:#fff8dc;stroke:#d49b00;stroke-width:3}.board{fill:#183f39;stroke:#0b2622;stroke-width:5}.dim{fill:#dce4e8;stroke:#7c8b91;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="62" class="title" text-anchor="middle">Adafruit Feather HUZZAH ESP8266 — Current Wiring</text>
  <text x="800" y="98" class="sub" text-anchor="middle">TOP / COMPONENT VIEW • USB and battery-connector end at LEFT • both headers shown</text>

  <rect x="260" y="170" width="1080" height="570" rx="48" class="board"/>
  <rect x="190" y="360" width="130" height="180" rx="18" class="dim"/>
  <text x="255" y="455" class="call" text-anchor="middle" transform="rotate(-90 255 455)">MICRO USB</text>
  <rect x="330" y="190" width="175" height="80" rx="12" fill="#f4f4f4" stroke="#777" stroke-width="3"/>
  <text x="417" y="238" class="call" text-anchor="middle">LiPo / BAT</text>
  <rect x="670" y="345" width="410" height="190" rx="18" fill="#244c66" stroke="#9cc5dd" stroke-width="3"/>
  <text x="875" y="425" fill="#fff" font-family="Segoe UI,Arial" font-size="30" font-weight="700" text-anchor="middle">ESP8266</text>
  <text x="875" y="468" fill="#d8efff" font-family="Segoe UI,Arial" font-size="24" text-anchor="middle">Feather HUZZAH</text>

  <!-- short 12-pin header, left to right from battery end -->
  <g>
    <circle cx="405" cy="300" r="22" class="pin"/><circle cx="475" cy="300" r="22" class="pin"/><circle cx="545" cy="300" r="22" class="pin"/>
    <circle cx="615" cy="300" r="25" class="pin used"/><circle cx="685" cy="300" r="25" class="pin used"/><circle cx="755" cy="300" r="25" class="pin used"/><circle cx="825" cy="300" r="25" class="pin used"/>
    <circle cx="895" cy="300" r="22" class="pin"/><circle cx="965" cy="300" r="22" class="pin"/><circle cx="1035" cy="300" r="22" class="pin"/><circle cx="1105" cy="300" r="22" class="pin"/><circle cx="1175" cy="300" r="22" class="pin"/>
    <text x="405" y="343" class="label">BAT</text><text x="475" y="343" class="label">EN</text><text x="545" y="343" class="label">USB</text>
    <text x="615" y="343" class="label">GPIO14</text><text x="685" y="343" class="label">GPIO12</text><text x="755" y="343" class="label">GPIO13</text><text x="825" y="343" class="label">GPIO15</text>
    <text x="895" y="343" class="label">GPIO0</text><text x="965" y="343" class="label">GPIO16</text><text x="1035" y="343" class="label">GPIO2</text><text x="1105" y="343" class="label">SCL/5</text><text x="1175" y="343" class="label">SDA/4</text>
  </g>

  <!-- wires from used short-header pins -->
  <path d="M615 275 C615 205 560 165 510 125" class="wire" stroke="#e8edf1"/><path d="M615 275 C615 205 560 165 510 125" fill="none" stroke="#67727a" stroke-width="2"/>
  <text x="390" y="126" class="small" font-weight="700" text-anchor="middle"><tspan x="390">WHITE — OPTO SIGNAL</tspan><tspan x="390" dy="22">J2 pin 2 → GPIO14</tspan></text>
  <path d="M685 275 C685 205 690 165 690 125" class="wire" stroke="#754421"/><path d="M685 275 C685 205 690 165 690 125" class="stripe"/>
  <text x="690" y="126" class="small" font-weight="700" text-anchor="middle"><tspan x="690">BROWN/WHITE</tspan><tspan x="690" dy="22">→ Pi GPIO26</tspan></text>
  <path d="M755 275 C780 205 860 170 930 125" class="wire" stroke="#e8edf1"/><path d="M755 275 C780 205 860 170 930 125" fill="none" stroke="#67727a" stroke-width="2"/>
  <text x="965" y="126" class="small" font-weight="700" text-anchor="middle"><tspan x="965">WHITE</tspan><tspan x="965" dy="22">→ camera Trig+ / XTR</tspan></text>
  <path d="M825 275 C870 215 1050 180 1190 125" class="wire" stroke="#26833e"/><path d="M825 275 C870 215 1050 180 1190 125" class="stripe"/>
  <text x="1280" y="126" class="small" font-weight="700" text-anchor="middle"><tspan x="1280">GREEN/WHITE</tspan><tspan x="1280" dy="22">→ Pi GPIO16</tspan></text>

  <!-- long 16-pin header -->
  <g>
    <circle cx="330" cy="650" r="18" class="pin"/><circle cx="390" cy="650" r="18" class="pin"/><circle cx="450" cy="650" r="18" class="pin"/><circle cx="510" cy="650" r="22" class="pin used"/>
    <circle cx="570" cy="650" r="18" class="pin"/><circle cx="630" cy="650" r="18" class="pin"/><circle cx="690" cy="650" r="18" class="pin"/><circle cx="750" cy="650" r="18" class="pin"/>
    <circle cx="810" cy="650" r="18" class="pin"/><circle cx="870" cy="650" r="18" class="pin"/><circle cx="930" cy="650" r="18" class="pin"/><circle cx="990" cy="650" r="18" class="pin"/>
    <circle cx="1050" cy="650" r="18" class="pin"/><circle cx="1110" cy="650" r="18" class="pin"/><circle cx="1170" cy="650" r="18" class="pin"/><circle cx="1230" cy="650" r="18" class="pin"/>
    <text x="330" y="695" class="label">RST</text><text x="390" y="695" class="label">3V3</text><text x="450" y="695" class="label">NC</text><text x="510" y="695" class="label">GND</text>
    <text x="570" y="695" class="label">ADC</text><text x="630" y="695" class="label">NC</text><text x="690" y="695" class="label">NC</text><text x="750" y="695" class="label">NC</text>
    <text x="810" y="695" class="label">NC</text><text x="870" y="695" class="label">NC</text><text x="930" y="695" class="label">SCK/14</text><text x="990" y="695" class="label">MO/13</text>
    <text x="1050" y="695" class="label">MI/12</text><text x="1110" y="695" class="label">RX</text><text x="1170" y="695" class="label">TX</text><text x="1230" y="695" class="label">CHPD</text>
  </g>
  <path d="M390 675 C390 770 315 805 255 850" class="wire" stroke="#8b8f96"/>
  <text x="255" y="884" class="call" text-anchor="middle">GREY — J2 pin 3 VCC</text>
  <path d="M510 675 C510 770 535 810 555 850" class="wire" stroke="#151515"/>
  <text x="555" y="884" class="call" text-anchor="middle">BLACK — optoisolator J2 pin 1 ground</text>
  <text x="340" y="790" class="small">USB-end count: RST, 3V3, NC, then GND</text>

  <rect x="820" y="778" width="690" height="155" rx="18" class="note"/>
  <text x="850" y="820" class="call">CORRECTED AND BENCH VERIFIED — 2026-09-15</text>
  <text x="850" y="858" class="small">White J2-2 → GPIO14; grey J2-3 → 3V3; black J2-1 → ESP GND.</text>
  <text x="850" y="890" class="small">One 4.999 V / 100 µs W2 pulse produced one camera frame.</text>
  <text x="850" y="920" class="small">GPIO16 readback measured 898.8 µs for the 1000 µs gate.</text>
</svg>
