<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
  <defs><style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#526078}.board{fill:#286b47;stroke:#16432d;stroke-width:5}.pin{fill:#f2c75c;stroke:#6b5115;stroke-width:3}.used{stroke:#e43d30;stroke-width:7}.num{font-size:16px;font-weight:700;text-anchor:middle}.wire{fill:none;stroke-linecap:round;stroke-width:22}.stripe{fill:none;stroke:#fff;stroke-linecap:butt;stroke-width:8;stroke-dasharray:20 20}.call{font-size:24px;font-weight:700}.small{font-size:20px}.port{fill:#cfd7dc;stroke:#707b82;stroke-width:3}
