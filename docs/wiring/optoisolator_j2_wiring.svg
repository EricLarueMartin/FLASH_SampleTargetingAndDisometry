<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#526078}.board{fill:#23644b;stroke:#123c2c;stroke-width:5}.silk{fill:none;stroke:#fff;stroke-width:3}.pin{fill:#f1c65b;stroke:#654d13;stroke-width:4}.call{font-size:25px;font-weight:700}.small{font-size:21px}.wire{fill:none;stroke-linecap:round;stroke-width:22}.warn{fill:#fff2cd;stroke:#d18b00;stroke-width:4}.chip{fill:#242830;stroke:#c8d0d8;stroke-width:3}
  </style></defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="800" y="62" class="title" text-anchor="middle">Optoisolator PCB — J2 Output Header</text>
  <text x="800" y="100" class="sub" text-anchor="middle">TOP / COMPONENT VIEW from OptoIsolator.kicad_pcb • BNC at LEFT • J2 at RIGHT</text>
  <rect x="120" y="175" width="1220" height="430" rx="18" class="board"/>
  <rect x="85" y="275" width="180" height="225" rx="22" fill="#d8dde0" stroke="#667078" stroke-width="5"/>
  <circle cx="135" cy="388" r="54" fill="#333" stroke="#aaa" stroke-width="9"/>
  <text x="210" y="255" fill="#fff" font-family="Segoe UI,Arial" font-size="25" font-weight="700">J1 BNC INPUT</text>
  <rect x="590" y="270" width="180" height="145" rx="12" class="chip"/><text x="680" y="335" fill="#fff" font-family="Segoe UI,Arial" font-size="25" font-weight="700" text-anchor="middle">U1</text><text x="680" y="372" fill="#d6dde5" font-family="Segoe UI,Arial" font-size="19" text-anchor="middle">ACPL-P343</text>
  <path d="M300 388 H550" class="silk"/><path d="M810 340 H1130" class="silk"/>
  <text x="1115" y="220" fill="#fff" font-family="Segoe UI,Arial" font-size="26" font-weight="700">J2</text>
  <!-- Actual KiCad positions: pin 3 top, pin 2 middle, pin 1 bottom -->
  <circle cx="1180" cy="285" r="29" class="pin"/><circle cx="1180" cy="390" r="29" class="pin"/><rect x="1151" y="466" width="58" height="58" rx="5" class="pin"/>
  <text x="1100" y="293" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="700" text-anchor="end">PIN 3  VCC</text>
  <text x="1100" y="398" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="700" text-anchor="end">PIN 2  VO / SIGNAL</text>
  <text x="1100" y="505" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="700" text-anchor="end">PIN 1  GND2</text>
  <path d="M1210 285 H1510" class="wire" stroke="#8b8f96"/><text x="1515" y="235" class="call" text-anchor="end">GREY (outer)</text><text x="1515" y="265" class="small" text-anchor="end">VCC → ESP 3V3</text>
  <path d="M1210 390 H1510" class="wire" stroke="#eef2f5"/><path d="M1210 390 H1510" fill="none" stroke="#67727a" stroke-width="2"/><text x="1515" y="340" class="call" text-anchor="end">WHITE (middle)</text><text x="1515" y="370" class="small" text-anchor="end">VO signal → ESP GPIO14</text>
  <path d="M1210 495 H1510" class="wire" stroke="#141414"/><text x="1515" y="445" class="call" text-anchor="end">BLACK (ground end)</text><text x="1515" y="475" class="small" text-anchor="end">GND2 → ESP GND</text>

  <rect x="120" y="650" width="1360" height="190" rx="18" class="warn"/>
  <text x="155" y="698" class="call">CORRECTED AND BENCH VERIFIED — 2026-09-15</text>
  <text x="155" y="742" class="small">BLACK J2-1 → GND, WHITE J2-2 → GPIO14 signal, GREY J2-3 → ESP 3V3.</text>
  <text x="155" y="780" class="small">A 4.999 V, 100 µs W2 pulse generated one camera frame and one GPIO16 monitor pulse.</text>
  <text x="155" y="818" class="small">Measured monitor high: 898.8 µs for a configured 1000 µs ESP shutter gate.</text>
</svg>
